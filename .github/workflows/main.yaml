name: Lint, build and release
on:
  push:
    branches:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - name: setup repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: setup node.js
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          node-version: 26
          pnpm-version: 10
      - run: npm run lint
    timeout-minutes: 10
  test:
    env:
      TEST_ONLY_NON_INTEGRATION: 'true'
    runs-on: ubuntu-latest
    name: Test matrix
    strategy:
      matrix:
        node-version: ['20.9', '22', '24', '26']
    steps:
      - name: setup repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: setup node.js
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          node-version: ${{ matrix.node-version }}
          pnpm-version: 10
      - run: npm run test
    timeout-minutes: 10
  # Branch protection requires a check named "Test". Matrix jobs report as
  # "Test matrix (<node version>)", so this job aggregates them under that name.
  test-gate:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: check test matrix result
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "Test matrix did not succeed: ${{ needs.test.result }}"
            exit 1
          fi
    timeout-minutes: 5
  test-pg-integration:
    env:
      TEST_ONLY_PG_INTEGRATION: 'true'
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    name: Test "pg" integration
    steps:
      - name: setup repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: setup node.js
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          node-version: 26
          pnpm-version: 10
      - run: npm run test
        env:
          POSTGRES_DSN: postgres:postgres@localhost:5432
    timeout-minutes: 10
  test-postgres-integration:
    env:
      TEST_ONLY_POSTGRES_INTEGRATION: 'true'
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    runs-on: ubuntu-latest
    name: Test "postgres" integration
    steps:
      - name: setup repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: setup node.js
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          node-version: 26
          pnpm-version: 10
      - run: npm run test
        env:
          POSTGRES_DSN: postgres:postgres@localhost:5432
    timeout-minutes: 10
  release:
    needs:
      - lint
      - test
      - test-pg-integration
      - test-postgres-integration
    runs-on: ubuntu-latest
    name: Release
    steps:
      - name: setup repository
        uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: setup node.js
        uses: silverhand-io/actions-node-pnpm-run-steps@v5
        with:
          node-version: 26
          pnpm-version: 10
      - run: npm run build
      # Publish the version bumped in the pull request. Skipping an existing
      # version keeps pushes that do not bump it from failing.
      - name: publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "$NODE_AUTH_TOKEN"
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@silverhand/slonik@$VERSION" version >/dev/null 2>&1; then
            echo "@silverhand/slonik@$VERSION is already published, skipping."
            exit 0
          fi
          npm publish
